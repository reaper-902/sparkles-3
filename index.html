<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon Grid</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .logo {
            position: absolute;
            top: 12px;
            left: 14px;
            width: 64px;
            height: 64px;
            z-index: 10;
            pointer-events: none;
            animation: logoGlow 2.6s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 3px rgba(255, 40, 200, 0.45)); }
            50%      { filter: drop-shadow(0 0 12px rgba(255, 40, 200, 0.95)); }
        }
    </style>
</head>

<body>

<audio id="bgMusic" loop preload="auto">
    <source src="loadingscreenserver.mp3" type="audio/mpeg">
</audio>

<svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <!-- knife -->
    <path d="M32 3 C36 13 38 24 37 36 L27 36 C26 24 28 13 32 3 Z"
          fill="#15151a" stroke="rgba(255,255,255,0.85)" stroke-width="1.2"/>
    <rect x="22" y="36" width="20" height="4" rx="2"
          fill="#15151a" stroke="rgba(255,255,255,0.85)" stroke-width="1.2"/>
    <rect x="28" y="40" width="8" height="17" rx="3"
          fill="#15151a" stroke="rgba(255,255,255,0.85)" stroke-width="1.2"/>

    <!-- snake body winding around the knife -->
    <path d="M17 60 C17 49 47 51 47 42 C47 33 17 35 17 27 C17 19 47 21 47 14 C47 11 45 10 43 10"
          fill="none" stroke="#ff28c8" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- snake head -->
    <ellipse cx="40" cy="9" rx="5" ry="3.8" fill="#ff28c8"/>
    <circle cx="39" cy="8" r="1" fill="#000"/>
    <path d="M35 9 L31 9 M31 9 L29 7.5 M31 9 L29 10.5"
          stroke="#ff7ad9" stroke-width="1" stroke-linecap="round" fill="none"/>
</svg>

<canvas id="scene"></canvas>

<script>
    /* =====================================================
       SETTINGS
    ===================================================== */
    const STAR_COUNT = 400;          // amount of stars
    const FLOOR_SPEED = 0.05;        // how fast the floor moves
    const PINK = "255, 40, 150";     // floor color (R, G, B)

    const STAR_COLORS = [            // star colors (R, G, B)
        "255, 30, 50",    // red
        "255, 255, 255",  // white
        "255, 40, 200",   // magenta
        "60, 130, 255"    // blue
    ];

    /* =====================================================
       SCENE
    ===================================================== */
    function makeStars(count, w, h) {
        const arr = [];
        for (let i = 0; i < count; i++) arr.push(newStar(w, h, true));
        return arr;
    }

    function newStar(w, h, randomDepth) {
        return {
            x: (Math.random() - 0.5) * w * 1.4,
            y: -Math.random() * h * 0.6,
            z: randomDepth ? Math.random() * w : w,
            speed: Math.random() * 2.2 + 0.8,
            size: Math.random() * 2 + 0.8,
            color: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0],
            alpha: Math.random() * 0.6 + 0.4,
            twinkle: Math.random() * 0.03 + 0.008,
            direction: Math.random() < 0.5 ? 1 : -1
        };
    }

    function drawScene(ctx, canvas, stars, offset, horizonRatio) {
        const w = canvas.width;
        const h = canvas.height;
        const horizon = Math.floor(h * horizonRatio);
        const cx = w / 2;

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createLinearGradient(0, horizon - h * 0.22, 0, horizon + h * 0.04);
        glow.addColorStop(0, `rgba(${PINK}, 0)`);
        glow.addColorStop(1, `rgba(${PINK}, 0.28)`);
        ctx.fillStyle = glow;
        ctx.fillRect(0, horizon - h * 0.22, w, h * 0.26);

        /* STARS */
        for (let i = stars.length - 1; i >= 0; i--) {
            const s = stars[i];

            s.z -= s.speed;
            s.alpha += s.twinkle * s.direction;
            if (s.alpha >= 1) { s.alpha = 1; s.direction = -1; }
            if (s.alpha <= 0.2) { s.alpha = 0.2; s.direction = 1; }

            const scale = w / s.z;
            const x = cx + s.x * scale;
            const y = horizon + s.y * scale;
            const size = Math.max(1, s.size * scale * 0.9);

            if (s.z < 1 || y < -20 || x < -20 || x > w + 20) {
                stars[i] = newStar(w, h, false);
                continue;
            }

            if (y >= horizon) continue;

            ctx.fillStyle = `rgba(${s.color}, ${s.alpha})`;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(size), Math.ceil(size));

            if (size > 3) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgba(${s.color}, 0.9)`;
                ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(size), Math.ceil(size));
                ctx.shadowBlur = 0;
            }
        }

        /* NEON TILE FLOOR */
        const focal = h * 0.8;
        const camH = 1;
        const zFar = 45;
        const zNear = 0.3;

        const grad = ctx.createLinearGradient(0, horizon, 0, h);
        grad.addColorStop(0, `rgba(${PINK}, 0)`);
        grad.addColorStop(0.25, `rgba(${PINK}, 0.55)`);
        grad.addColorStop(1, `rgba(${PINK}, 1)`);

        const floorFill = ctx.createLinearGradient(0, horizon, 0, h);
        floorFill.addColorStop(0, `rgba(${PINK}, 0)`);
        floorFill.addColorStop(1, `rgba(${PINK}, 0.12)`);
        ctx.fillStyle = floorFill;
        ctx.fillRect(0, horizon, w, h - horizon);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, horizon, w, h - horizon);
        ctx.clip();

        ctx.shadowBlur = 8;
        ctx.shadowColor = `rgba(${PINK}, 0.9)`;
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;

        ctx.beginPath();
        for (let j = -40; j <= 40; j++) {
            const x1 = cx + (j * focal) / zNear;
            const y1 = horizon + (camH * focal) / zNear;
            const x2 = cx + (j * focal) / zFar;
            const y2 = horizon + (camH * focal) / zFar;
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
        }
        ctx.stroke();

        const frac = offset % 1;
        for (let k = 1; k <= zFar; k++) {
            const z = k - frac;
            if (z < zNear) continue;
            const y = horizon + (camH * focal) / z;
            ctx.lineWidth = Math.max(1, 3.2 - z * 0.08);
            ctx.globalAlpha = Math.max(0.08, 1 - z / zFar);
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        ctx.shadowBlur = 0;

        ctx.fillStyle = `rgba(${PINK}, 0.9)`;
        ctx.shadowBlur = 14;
        ctx.shadowColor = `rgba(${PINK}, 1)`;
        ctx.fillRect(0, horizon, w, 2);
        ctx.shadowBlur = 0;
    }

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    let stars = [];
    let offset = 0;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = makeStars(STAR_COUNT, canvas.width, canvas.height);
    }

    function animate() {
        offset += FLOOR_SPEED;
        drawScene(ctx, canvas, stars, offset, 0.5);
        requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    animate();

    /* =====================================================
       MUSIC
    ===================================================== */
    const music = document.getElementById("bgMusic");
    music.volume = 0.5;
    music.play().catch(() => console.log("Music autoplay was blocked."));
</script>

</body>
</html>
